name: Database migrations

on:
  # PRs: validate migrations against a throwaway Postgres container only. Never touches DB_URL.
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
    paths:
      - 'prisma/**'
      - 'prisma.config.ts'
      - '.github/workflows/database-migrations.yml'
  # Push (i.e. a merged PR): deploy migrations to the real database.
  push:
    branches: [dev, main]
    paths:
      - 'prisma/**'
      - 'prisma.config.ts'
      - '.github/workflows/database-migrations.yml'

permissions:
  contents: read

jobs:
  migration-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: doam_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d doam_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/doam_test?schema=public
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply all migrations to a clean database
        run: npx prisma migrate deploy
      - name: Confirm migration state
        run: npx prisma migrate status

  migration-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      DATABASE_URL: ${{ secrets.DB_URL }}
    steps:
      - name: Check out merged default branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Deploy committed migrations
        run: npx prisma migrate deploy
